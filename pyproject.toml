[project]
name = "founder-engine"
version = "0.1.0"
description = "Stairpay founder content engine: Slack bot and pipeline"
requires-python = ">=3.11"
dependencies = [
  "slack_bolt>=1.18",
  "anthropic>=0.40",
  "pyyaml>=6",
  "gunicorn>=22",
]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16"]
dev = ["pytest>=8"]
visuals = ["playwright>=1.40"]  # then: playwright install chromium

[project.scripts]
founder-engine = "founder_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
